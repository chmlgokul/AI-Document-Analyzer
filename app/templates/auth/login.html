{% extends "base.html" %}

{% block title %}
Login - AI Document Analyzer
{% endblock %}

{% block content %}

<div class="auth-container">

    <div class="auth-card">

        <h1>AI Document Analyzer</h1>

        <p class="auth-subtitle">
            Login to your account
        </p>

        <form
            method="POST"
            action="{{ url_for('auth.login') }}"
        >

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <button type="submit">
                Login
            </button>

        </form>


        <p class="auth-link">
            Don't have an account?
            <a href="{{ url_for('auth.register') }}">
                Register
            </a>
        </p>

    </div>

</div>

{% endblock %}
