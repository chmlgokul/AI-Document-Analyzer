{% extends "base.html" %}

{% block title %}
Login - AI Document Analyzer
{% endblock %}

{% block content %}

<div class="auth-page">

    <div class="auth-card">

        <!-- Header -->
        <div class="auth-header">

            <div class="auth-icon">
                AI
            </div>

            <h1>Welcome Back</h1>

            <p>
                Sign in to continue to AI Document Analyzer
            </p>

        </div>


        <!-- Login Form -->
        <form
            method="POST"
            action="{{ url_for('auth.login') }}"
            class="auth-form"
        >

            <!-- Email -->
            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email address"
                    autocomplete="email"
                    required
                >

            </div>


            <!-- Password -->
            <div class="form-group">

                <div class="form-label-row">

                    <label for="password">
                        Password
                    </label>

                </div>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

            </div>


            <!-- Submit -->
            <button
                type="submit"
                class="auth-submit"
            >
                Sign In
            </button>

        </form>


        <!-- Register Link -->
        <div class="auth-footer">

            <p>
                Don't have an account?
                <a href="{{ url_for('auth.register') }}">
                    Create an account
                </a>
            </p>

        </div>

    </div>

</div>

{% endblock %}
