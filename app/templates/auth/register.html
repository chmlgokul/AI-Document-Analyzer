{% extends "base.html" %}

{% block title %}
Register - AI Document Analyzer
{% endblock %}


{% block extra_css %}

<style>

/* =========================================================
   AUTH PAGE
   ========================================================= */

.auth-page {
    min-height: calc(100vh - 90px);

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 45px 20px 65px;

    position: relative;
    overflow: hidden;

    background:
        radial-gradient(
            circle at 15% 20%,
            rgba(99, 102, 241, 0.18),
            transparent 30%
        ),
        radial-gradient(
            circle at 85% 75%,
            rgba(6, 182, 212, 0.14),
            transparent 32%
        ),
        linear-gradient(
            135deg,
            #f8fafc,
            #eef2ff
        );
}


/* =========================================================
   GRID
   ========================================================= */

.auth-page::before {
    content: "";

    position: absolute;
    inset: 0;

    pointer-events: none;

    opacity: 0.35;

    background-image:
        linear-gradient(
            rgba(148, 163, 184, 0.08) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(148, 163, 184, 0.08) 1px,
            transparent 1px
        );

    background-size: 42px 42px;
}


/* =========================================================
   GLOW
   ========================================================= */

.auth-page::after {
    content: "";

    position: absolute;

    width: 320px;
    height: 320px;

    right: -140px;
    bottom: -120px;

    border-radius: 50%;

    background: rgba(6, 182, 212, 0.14);

    filter: blur(80px);

    pointer-events: none;
}


/* =========================================================
   CARD
   ========================================================= */

.auth-card {
    position: relative;
    z-index: 2;

    width: min(480px, 100%);

    padding: 40px;

    border-radius: 26px;

    background:
        rgba(255, 255, 255, 0.78);

    border:
        1px solid
        rgba(255, 255, 255, 0.85);

    box-shadow:
        0 30px 80px
        rgba(15, 23, 42, 0.12);

    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);

    animation:
        authCardIn
        0.6s
        ease
        both;
}


@keyframes authCardIn {

    from {
        opacity: 0;
        transform: translateY(20px) scale(0.98);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }

}


/* =========================================================
   HEADER
   ========================================================= */

.auth-header {
    text-align: center;

    margin-bottom: 28px;
}


.auth-icon {
    width: 58px;
    height: 58px;

    margin: 0 auto 16px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 18px;

    background:
        linear-gradient(
            135deg,
            #4f46e5,
            #2563eb
        );

    color: white;

    font-size: 18px;

    font-weight: 800;

    letter-spacing: 0.5px;

    box-shadow:
        0 12px 30px
        rgba(79, 70, 229, 0.28);
}


.auth-header h1 {
    margin: 0 0 9px;

    color: #0f172a;

    font-size: 29px;

    line-height: 1.2;

    font-weight: 800;

    letter-spacing: -0.7px;
}


.auth-header p {
    margin: 0;

    color: #64748b;

    font-size: 14px;

    line-height: 1.6;
}


/* =========================================================
   FORM
   ========================================================= */

.auth-form {
    width: 100%;
}


.auth-form .form-group {
    margin-bottom: 17px;
}


.auth-form label {
    display: block;

    margin-bottom: 7px;

    color: #334155;

    font-size: 13px;

    font-weight: 700;
}


/* =========================================================
   INPUT
   ========================================================= */

.auth-form input {
    width: 100%;

    height: 49px;

    padding:
        0 15px;

    box-sizing: border-box;

    border:
        1px solid
        #dbe3ef;

    border-radius: 13px;

    background:
        rgba(255, 255, 255, 0.92);

    color: #0f172a;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size: 14px;

    outline: none;

    transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease,
        transform 0.2s ease;
}


.auth-form input::placeholder {
    color: #94a3b8;
}


.auth-form input:hover {
    border-color: #b8c5d8;
}


.auth-form input:focus {
    border-color: #6366f1;

    background: white;

    box-shadow:
        0 0 0 4px
        rgba(99, 102, 241, 0.10);

    transform: translateY(-1px);
}


/* =========================================================
   BUTTON
   ========================================================= */

.auth-submit {
    width: 100%;

    height: 51px;

    margin-top: 5px;

    border: none;

    border-radius: 13px;

    background:
        linear-gradient(
            135deg,
            #4f46e5,
            #2563eb
        );

    color: white;

    font-size: 14px;

    font-weight: 700;

    letter-spacing: 0.2px;

    cursor: pointer;

    box-shadow:
        0 12px 25px
        rgba(37, 99, 235, 0.20);

    transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        filter 0.2s ease;
}


.auth-submit:hover {
    transform: translateY(-2px);

    filter: brightness(1.04);

    box-shadow:
        0 17px 32px
        rgba(37, 99, 235, 0.26);
}


.auth-submit:active {
    transform: translateY(0);
}


/* =========================================================
   FOOTER
   ========================================================= */

.auth-footer {
    margin-top: 22px;

    text-align: center;
}


.auth-footer p {
    margin: 0;

    color: #64748b;

    font-size: 13px;

    line-height: 1.6;
}


.auth-footer a {
    color: #4f46e5;

    font-weight: 700;

    text-decoration: none;

    transition:
        color 0.2s ease;
}


.auth-footer a:hover {
    color: #2563eb;

    text-decoration: underline;
}


/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 600px) {

    .auth-page {
        min-height: calc(100vh - 70px);

        padding:
            30px 16px
            45px;
    }


    .auth-card {
        padding: 30px 22px;

        border-radius: 22px;
    }


    .auth-header {
        margin-bottom: 24px;
    }


    .auth-icon {
        width: 52px;
        height: 52px;

        border-radius: 16px;

        font-size: 16px;
    }


    .auth-header h1 {
        font-size: 25px;
    }


    .auth-header p {
        font-size: 13px;
    }


    .auth-form input {
        height: 48px;
    }


    .auth-submit {
        height: 49px;
    }

}

</style>

{% endblock %}


{% block content %}

<div class="auth-page">

    <div class="auth-card">

        <!-- Header -->

        <div class="auth-header">

            <div class="auth-icon">
                AI
            </div>

            <h1>
                Create Your Account
            </h1>

            <p>
                Register to start using AI Document Analyzer
            </p>

        </div>


        <!-- Registration Form -->

        <form
            method="POST"
            action="{{ url_for('auth.register') }}"
            class="auth-form"
        >

            <!-- Username -->

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    autocomplete="username"
                    required
                >

            </div>


            <!-- Email -->

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email address"
                    autocomplete="email"
                    required
                >

            </div>


            <!-- Password -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    autocomplete="new-password"
                    required
                >

            </div>


            <!-- Confirm Password -->

            <div class="form-group">

                <label for="confirm_password">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    placeholder="Re-enter your password"
                    autocomplete="new-password"
                    required
                >

            </div>


            <!-- Submit -->

            <button
                type="submit"
                class="auth-submit"
            >
                Create Account
            </button>

        </form>


        <!-- Login -->

        <div class="auth-footer">

            <p>

                Already have an account?

                <a
                    href="{{ url_for('auth.login') }}"
                >
                    Sign In
                </a>

            </p>

        </div>

    </div>

</div>

{% endblock %}
