{% extends "base.html" %}

{% block title %}
Register - AI Document Analyzer
{% endblock %}

{% block content %}

<div class="auth-page">

    <div class="auth-card">

        <!-- Header -->
        <div class="auth-header">

            <div class="auth-icon">
                AI
            </div>

            <h1>Create Your Account</h1>

            <p>
                Register to start using AI Document Analyzer
            </p>

        </div>


        <!-- Registration Form -->
        <form
            method="POST"
            action="{{ url_for('auth.register') }}"
            class="auth-form"
        >

            <!-- Username -->
            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    autocomplete="username"
                    required
                >

            </div>


            <!-- Email -->
            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email address"
                    autocomplete="email"
                    required
                >

            </div>


            <!-- Password -->
            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    autocomplete="new-password"
                    required
                >

            </div>


            <!-- Confirm Password -->
            <div class="form-group">

                <label for="confirm_password">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    placeholder="Re-enter your password"
                    autocomplete="new-password"
                    required
                >

            </div>


            <!-- Submit -->
            <button
                type="submit"
                class="auth-submit"
            >
                Create Account
            </button>

        </form>


        <!-- Login Link -->
        <div class="auth-footer">

            <p>
                Already have an account?

                <a href="{{ url_for('auth.login') }}">
                    Sign In
                </a>
            </p>

        </div>

    </div>

</div>

{% endblock %}
